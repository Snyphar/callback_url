{% extends 'base.html' %} {% block content %}
<div class="row">
  <div class="col-md-6">
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Create User</h5>
        <form method="post" action="{{ url_for('create_user') }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              class="form-control"
              type="password"
              name="password"
              required
            />
          </div>
          <div class="mb-3 form-check">
            <input
              class="form-check-input"
              type="checkbox"
              name="is_admin"
              value="1"
              id="isAdmin"
            />
            <label class="form-check-label" for="isAdmin">Is admin</label>
          </div>
          <button class="btn btn-primary" type="submit">Create</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Existing Users</h5>
        <ul class="list-group">
          {% for u in users %}
          <li class="list-group-item">
            <div class="d-flex justify-content-between align-items-start gap-3">
              <div>
                {{ u.username }} {% if u.is_admin %}<span class="badge bg-primary ms-2">admin</span>{% endif %}
                <span class="badge {% if u.is_active %}bg-success{% else %}bg-secondary{% endif %} ms-2">
                  {{ 'active' if u.is_active else 'inactive' }}
                </span>
              </div>
              {% if u.id != current_user.id %}
              <div class="d-flex gap-2">
                <form method="post" action="{{ url_for('update_user_password') }}" class="d-flex gap-1">
                  <input type="hidden" name="user_id" value="{{ u.id }}" />
                  <input class="form-control form-control-sm" type="password" name="password" placeholder="New password" required />
                  <button class="btn btn-sm btn-outline-primary" type="submit">Change password</button>
                </form>
                <form method="post" action="{{ url_for('toggle_user_active') }}">
                  <input type="hidden" name="user_id" value="{{ u.id }}" />
                  <button class="btn btn-sm btn-outline-secondary" type="submit">{{ 'Deactivate' if u.is_active else 'Activate' }}</button>
                </form>
                <form method="post" action="{{ url_for('delete_user') }}" onsubmit="return confirm('Delete this user?');">
                  <input type="hidden" name="user_id" value="{{ u.id }}" />
                  <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                </form>
              </div>
              {% endif %}
            </div>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</div>
{% endblock %}
